<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendar — Estreccella</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar">
    <div class="sidebar-logo"><span class="logo-icon">✦</span><span class="logo-text">Estreccella</span></div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Workspace</div>
      <a href="../index.html" class="nav-item"><span class="nav-icon">⊞</span> Dashboard</a>
      <a href="calendar.html" class="nav-item active"><span class="nav-icon">◫</span> Calendar</a>
      <a href="projects.html" class="nav-item"><span class="nav-icon">◈</span> Projects & Timeline</a>
      <a href="sprint.html" class="nav-item"><span class="nav-icon">◉</span> Sprint Board</a>
      <a href="meetings.html" class="nav-item"><span class="nav-icon">◎</span> Meetings</a>
      <a href="docs.html" class="nav-item"><span class="nav-icon">◻</span> Documents</a>
    </nav>
    <div class="sidebar-user" id="profile-trigger">
      <img id="user-photo" src="" alt="" class="user-avatar" onerror="this.src='https://ui-avatars.com/api/?background=2D2D2D&color=fff&name=U'"/>
      <div class="user-info"><div id="user-name" class="user-name">Loading...</div><div id="user-email" class="user-email"></div></div>
    </div>
  </aside>

  <main class="main-content" style="max-width:100%;">
    <div class="page-header">
      <h1 class="page-title">Calendar</h1>
      <p class="page-sub">Your auto-scheduled tasks for the week.</p>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
      <button class="btn-secondary" id="prev-week">← Prev Week</button>
      <span id="week-label" style="font-size:14px;font-weight:500;min-width:200px;text-align:center;"></span>
      <button class="btn-secondary" id="next-week">Next Week →</button>
      <button class="btn-primary" id="goto-today">Today</button>
    </div>

    <div style="display:flex;gap:20px;font-size:11px;color:#6B6B6B;margin-bottom:14px;flex-wrap:wrap;">
      <span>📅 <strong>Mon / Thu:</strong> 8am–5pm</span>
      <span>📅 <strong>Tue / Wed / Fri:</strong> 9am–6pm</span>
      <span style="color:#E53935;">⚠ Red = overdue</span>
      <span style="color:#2E7D32;">✓ Green = done</span>
    </div>

    <div class="calendar-grid" id="cal-grid">
      <div class="cal-day-header">Mon</div>
      <div class="cal-day-header">Tue</div>
      <div class="cal-day-header">Wed</div>
      <div class="cal-day-header">Thu</div>
      <div class="cal-day-header">Fri</div>
      <div class="cal-day-header">Sat</div>
      <div class="cal-day-header">Sun</div>
    </div>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyDCvcPiEW9zMs2hJSRXtF5lYtUyCMoRIlE",
    authDomain:        "estreccella.firebaseapp.com",
    projectId:         "estreccella",
    storageBucket:     "estreccella.firebasestorage.app",
    messagingSenderId: "403183247546",
    appId:             "1:403183247546:web:4764761e002cc1de602283"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  let uid = null, weekOffset = 0;

  onAuthStateChanged(auth, (user) => {
    if (!user) { window.location.href = "../index.html"; return; }
    uid = user.uid;
    document.getElementById("user-photo").src         = user.photoURL || "";
    document.getElementById("user-name").textContent  = user.displayName || "";
    document.getElementById("user-email").textContent = user.email || "";
    renderCalendar();
  });

  document.getElementById("prev-week").onclick  = () => { weekOffset--; renderCalendar(); };
  document.getElementById("next-week").onclick  = () => { weekOffset++; renderCalendar(); };
  document.getElementById("goto-today").onclick = () => { weekOffset = 0; renderCalendar(); };

  function getMonday(offset) {
    const d = new Date();
    const day = d.getDay();
    d.setDate(d.getDate() - day + (day === 0 ? -6 : 1) + offset * 7);
    d.setHours(0,0,0,0);
    return d;
  }

  async function renderCalendar() {
    const monday = getMonday(weekOffset);
    const sunday = new Date(monday); sunday.setDate(sunday.getDate() + 6);
    const fmt = d => d.toLocaleDateString("en-PH", { month:"short", day:"numeric", year:"numeric" });
    document.getElementById("week-label").textContent = `${fmt(monday)} — ${fmt(sunday)}`;

    const snap  = await getDocs(query(collection(db,"tasks"), where("ownerId","==",uid)));
    const tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    const grid = document.getElementById("cal-grid");
    while (grid.children.length > 7) grid.removeChild(grid.lastChild);

    const now = new Date();
    for (let i = 0; i < 7; i++) {
      const day       = new Date(monday); day.setDate(day.getDate() + i);
      const isToday   = day.toDateString() === now.toDateString();
      const dayStr    = day.toISOString().split("T")[0];
      const isWeekend = day.getDay() === 0 || day.getDay() === 6;

      const cell = document.createElement("div");
      cell.className = "cal-day" + (isToday ? " today" : "");
      if (isWeekend) cell.style.background = "#fafafa";

      const dateEl = document.createElement("div");
      dateEl.className = "cal-date" + (isToday ? " today-num" : "");
      dateEl.textContent = day.getDate();
      cell.appendChild(dateEl);

      if (isWeekend) {
        const wk = document.createElement("div");
        wk.style.cssText = "font-size:10px;color:#bbb;margin-top:2px;";
        wk.textContent = "Weekend";
        cell.appendChild(wk);
      }

      tasks.forEach(task => {
        const schedDay = task.scheduledStart ? task.scheduledStart.split("T")[0] : null;
        const dueDay   = task.dueDate || null;
        if (schedDay !== dayStr && dueDay !== dayStr) return;

        const isOverdue = task.dueDate && new Date(task.dueDate) < now && task.status !== "done";
        const isDone    = task.status === "done";
        const el = document.createElement("div");
        el.className = `cal-task p${task.priority}`;
        if (isOverdue) { el.style.background = "#ffeaea"; el.style.color = "#c62828"; }
        if (isDone)    { el.style.opacity = ".5"; el.style.textDecoration = "line-through"; }
        const timeStr = task.scheduledStart
          ? new Date(task.scheduledStart).toLocaleTimeString("en-PH", { hour:"2-digit", minute:"2-digit" }) + " "
          : "";
        el.textContent = (isOverdue ? "⚠ " : isDone ? "✓ " : "") + timeStr + task.title;
        el.title = `${task.title} (${task.estimatedHours||1}h)`;
        cell.appendChild(el);
      });

      grid.appendChild(cell);
    }
  }
</script>
</body>
</html>
