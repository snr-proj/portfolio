<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meetings — Estreccella</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar">
    <div class="sidebar-logo"><span class="logo-icon">✦</span><span class="logo-text">Estreccella</span></div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Workspace</div>
      <a href="../index.html" class="nav-item"><span class="nav-icon">⊞</span> Dashboard</a>
      <a href="calendar.html" class="nav-item"><span class="nav-icon">◫</span> Calendar</a>
      <a href="projects.html" class="nav-item"><span class="nav-icon">◈</span> Projects & Timeline</a>
      <a href="sprint.html" class="nav-item"><span class="nav-icon">◉</span> Sprint Board</a>
      <a href="meetings.html" class="nav-item active"><span class="nav-icon">◎</span> Meetings</a>
      <a href="docs.html" class="nav-item"><span class="nav-icon">◻</span> Documents</a>
    </nav>
    <div class="sidebar-user">
      <img id="user-photo" src="" alt="" class="user-avatar" onerror="this.src='https://ui-avatars.com/api/?background=2D2D2D&color=fff&name=U'"/>
      <div class="user-info"><div id="user-name" class="user-name">Loading...</div><div id="user-email" class="user-email"></div></div>
    </div>
  </aside>

  <main class="main-content">
    <div id="list-view">
      <div class="page-header">
        <h1 class="page-title">Meetings</h1>
        <p class="page-sub">Log meeting notes, action items, and attachments.</p>
      </div>
      <div style="margin-bottom:20px;">
        <button class="btn-primary" id="new-meeting-btn">+ New Meeting</button>
      </div>
      <div id="meeting-list"><p class="empty-state">No meetings yet.</p></div>
    </div>

    <div id="editor-view" class="hidden">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap;">
        <button class="btn-secondary" id="back-btn">← Back</button>
        <h1 class="page-title" style="flex:1;" id="editor-heading">Meeting Notes</h1>
        <button class="btn-danger" id="delete-btn">Delete</button>
        <button class="btn-primary" id="save-btn">Save</button>
      </div>

      <div style="background:#fff;border:1px solid #E2E2E2;border-radius:12px;padding:24px;margin-bottom:20px;">
        <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div><label class="label">Meeting title *</label><input type="text" id="m-title" class="input" style="width:100%;" placeholder="e.g. Sprint Planning"/></div>
          <div><label class="label">Date & time</label><input type="datetime-local" id="m-date" class="input" style="width:100%;"/></div>
        </div>
        <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div><label class="label">Attendees</label><input type="text" id="m-attendees" class="input" style="width:100%;" placeholder="Names, comma separated"/></div>
          <div><label class="label">Project (optional)</label><input type="text" id="m-project" class="input" style="width:100%;" placeholder="Project name"/></div>
        </div>
      </div>

      <div style="background:#fff;border:1px solid #E2E2E2;border-radius:12px 12px 0 0;border-bottom:none;padding:8px 14px;display:flex;gap:4px;flex-wrap:wrap;">
        <button onclick="document.execCommand('bold')" class="tb-btn"><b>B</b></button>
        <button onclick="document.execCommand('italic')" class="tb-btn"><i>I</i></button>
        <button onclick="document.execCommand('underline')" class="tb-btn"><u>U</u></button>
        <span style="width:1px;background:#E2E2E2;margin:0 4px;"></span>
        <button onclick="insEl('<h3 style=\'font-size:15px;font-weight:600;margin:10px 0 4px;\'>Heading</h3>')" class="tb-btn">H3</button>
        <button onclick="insEl('<ul style=\'padding-left:18px;\'><li>Item</li></ul>')" class="tb-btn">• List</button>
        <button onclick="insEl('<div>☐ Action item</div>')" class="tb-btn">☐ Todo</button>
        <button onclick="insEl('<hr style=\'border:none;border-top:1px solid #E2E2E2;margin:12px 0;\'/>')" class="tb-btn">— Line</button>
        <button onclick="insDate()" class="tb-btn">📅 Date</button>
      </div>
      <div id="m-notes" class="editor-area" contenteditable="true"
        style="border-radius:0 0 12px 12px;min-height:280px;"
        placeholder="Type your meeting notes here... Use ☐ Todo button to add action items.">
      </div>

      <div style="margin-top:20px;">
        <label class="label">Attachments</label>
        <div style="display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap;">
          <label class="btn-secondary" style="cursor:pointer;">📎 Attach file<input type="file" id="m-attach" multiple style="display:none;"/></label>
          <div id="m-attach-list" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
        </div>
      </div>

      <div style="margin-top:24px;background:#fff;border:1px solid #E2E2E2;border-radius:12px;padding:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3 style="font-size:13px;font-weight:600;">Action Items</h3>
          <button class="btn-secondary" id="extract-btn">⚡ Extract from notes</button>
        </div>
        <div id="action-items"><p style="font-size:12px;color:#6B6B6B;">Click "Extract from notes" to pull ☐ items automatically.</p></div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyDCvcPiEW9zMs2hJSRXtF5lYtUyCMoRIlE",
    authDomain:        "estreccella.firebaseapp.com",
    projectId:         "estreccella",
    storageBucket:     "estreccella.firebasestorage.app",
    messagingSenderId: "403183247546",
    appId:             "1:403183247546:web:4764761e002cc1de602283"
  };

  const app     = initializeApp(firebaseConfig);
  const auth    = getAuth(app);
  const db      = getFirestore(app);
  const storage = getStorage(app);
  let uid = null, currentId = null, pendingFiles = [], attachments = [];

  onAuthStateChanged(auth, (user) => {
    if (!user) { window.location.href = "../index.html"; return; }
    uid = user.uid;
    document.getElementById("user-photo").src         = user.photoURL || "";
    document.getElementById("user-name").textContent  = user.displayName || "";
    document.getElementById("user-email").textContent = user.email || "";
    loadList();
  });

  async function loadList() {
    try {
      const snap = await getDocs(query(collection(db,"meetings"), where("ownerId","==",uid), orderBy("date","desc")));
      renderList(snap.docs);
    } catch {
      const snap = await getDocs(query(collection(db,"meetings"), where("ownerId","==",uid)));
      renderList(snap.docs.sort((a,b) => (b.data().date||"").localeCompare(a.data().date||"")));
    }
  }

  function renderList(docs) {
    const list = document.getElementById("meeting-list");
    if (!docs.length) { list.innerHTML = '<p class="empty-state">No meetings yet.</p>'; return; }
    list.innerHTML = docs.map(d => {
      const m = d.data();
      const dateStr = m.date ? new Date(m.date).toLocaleString("en-PH",{weekday:"short",month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "No date";
      const preview = m.notes ? m.notes.replace(/<[^>]+>/g,"").substring(0,100)+"…" : "No notes yet.";
      return `
        <div class="meeting-card" onclick="openMeeting('${d.id}')">
          <div class="meeting-date">◎ ${dateStr}${m.project?" · "+m.project:""}</div>
          <div class="meeting-title">${m.title||"Untitled Meeting"}</div>
          <div class="meeting-preview">${preview}</div>
          ${m.attendees?`<div style="margin-top:4px;font-size:11px;color:#aaa;">👥 ${m.attendees}</div>`:""}
        </div>`;
    }).join("");
  }

  window.openMeeting = async (id) => {
    currentId = id;
    const snap  = await getDocs(query(collection(db,"meetings"), where("ownerId","==",uid)));
    const found = snap.docs.find(d => d.id === id);
    if (!found) return;
    const m = found.data();
    document.getElementById("m-title").value     = m.title || "";
    document.getElementById("m-date").value      = m.date ? m.date.replace(" ","T").substring(0,16) : "";
    document.getElementById("m-attendees").value = m.attendees || "";
    document.getElementById("m-project").value   = m.project  || "";
    document.getElementById("m-notes").innerHTML = m.notes    || "";
    attachments = m.attachments || []; pendingFiles = [];
    renderAttachList();
    document.getElementById("editor-heading").textContent = m.title || "Meeting Notes";
    showEditor();
  };

  function showEditor() { document.getElementById("list-view").classList.add("hidden"); document.getElementById("editor-view").classList.remove("hidden"); }
  function showList()   { document.getElementById("editor-view").classList.add("hidden"); document.getElementById("list-view").classList.remove("hidden"); currentId=null; pendingFiles=[]; attachments=[]; loadList(); }

  document.getElementById("new-meeting-btn").onclick = () => {
    currentId=null; attachments=[]; pendingFiles=[];
    ["m-title","m-attendees","m-project"].forEach(id=>document.getElementById(id).value="");
    document.getElementById("m-date").value=new Date().toISOString().slice(0,16);
    document.getElementById("m-notes").innerHTML="";
    document.getElementById("m-attach-list").innerHTML="";
    document.getElementById("editor-heading").textContent="New Meeting";
    showEditor();
  };

  document.getElementById("back-btn").onclick = showList;

  document.getElementById("save-btn").onclick = async () => {
    const title = document.getElementById("m-title").value.trim();
    if (!title) { alert("Please enter a meeting title"); return; }
    for (const file of pendingFiles) {
      const r = ref(storage,`meetings/${uid}/${Date.now()}_${file.name}`);
      await uploadBytes(r,file);
      attachments.push({ name:file.name, url:await getDownloadURL(r) });
    }
    pendingFiles=[];
    const data = {
      title, date: document.getElementById("m-date").value,
      attendees: document.getElementById("m-attendees").value.trim(),
      project:   document.getElementById("m-project").value.trim(),
      notes:     document.getElementById("m-notes").innerHTML,
      attachments, ownerId:uid, updatedAt:serverTimestamp(),
    };
    if (currentId) { await updateDoc(doc(db,"meetings",currentId),data); }
    else { const r=await addDoc(collection(db,"meetings"),{...data,createdAt:serverTimestamp()}); currentId=r.id; }
    showToast("Meeting saved!");
    document.getElementById("editor-heading").textContent=title;
  };

  document.getElementById("delete-btn").onclick = async () => {
    if (!currentId) { showList(); return; }
    if (!confirm("Delete this meeting?")) return;
    await deleteDoc(doc(db,"meetings",currentId)); showList();
  };

  document.getElementById("m-attach").onchange = (e) => {
    Array.from(e.target.files).forEach(f => {
      pendingFiles.push(f);
      const s=document.createElement("span"); s.className="tag"; s.textContent="📎 "+f.name;
      document.getElementById("m-attach-list").appendChild(s);
    });
    e.target.value="";
  };

  function renderAttachList() {
    document.getElementById("m-attach-list").innerHTML=attachments.map(a=>
      `<a href="${a.url}" target="_blank" class="tag" style="text-decoration:none;">📎 ${a.name}</a>`).join("");
  }

  document.getElementById("extract-btn").onclick = () => {
    const raw = document.getElementById("m-notes").innerHTML;
    const text = raw.replace(/<br\s*\/?>/gi,"\n").replace(/<\/li>/gi,"\n").replace(/<\/p>/gi,"\n").replace(/<[^>]+>/g,"");
    const lines = text.split("\n").map(l=>l.trim()).filter(l => l && (
      l.includes("☐") || /^action:|^todo:|^\d+\.|^[-•*]/.test(l.toLowerCase()) || /action:|todo:/i.test(l)
    ));
    const el = document.getElementById("action-items");
    if (!lines.length) {
      el.innerHTML = '<p style="font-size:12px;color:#6B6B6B;padding:8px 0;">No action items found. Use ☐ Todo button or type "Action:" before items in your notes.</p>';
      return;
    }
    const items = lines.map((l,i) => {
      const clean = l.replace(/^☐|^[-•*]|^\d+\.|^action:|^todo:/gi,"").trim();
      return `<li style="display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:#F7F7F5;border:1px solid #E2E2E2;border-radius:10px;list-style:none;">
        <span style="width:22px;height:22px;border-radius:50%;background:#0F0F0F;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;">${i+1}</span>
        <span style="flex:1;font-size:13px;line-height:1.5;">${clean}</span>
        <button onclick="addActionTask(this,'${encodeURIComponent(clean)}')" class="btn-secondary" style="font-size:11px;padding:4px 12px;flex-shrink:0;">+ Add Task</button>
      </li>`;
    }).join("");
    el.innerHTML = `<div style="font-size:11px;color:#aaa;margin-bottom:10px;">Found ${lines.length} action item${lines.length>1?"s":""}</div><ol style="padding:0;margin:0;display:flex;flex-direction:column;gap:8px;">${items}</ol>`;
  };

  window.addActionTask = async (btn, encoded) => {
    await addDoc(collection(db,"tasks"),{title:decodeURIComponent(encoded),priority:3,estimatedHours:1,status:"todo",ownerId:uid,createdAt:serverTimestamp()});
    btn.textContent="✓ Added"; btn.disabled=true; showToast("Task added!");
  };

  window.insEl   = (html) => { document.getElementById("m-notes").focus(); document.execCommand("insertHTML",false,html); };
  window.insDate = () => { const d=new Date().toLocaleDateString("en-PH",{weekday:"long",year:"numeric",month:"long",day:"numeric"}); document.getElementById("m-notes").focus(); document.execCommand("insertHTML",false,`<strong>${d}</strong>`); };

  function showToast(msg) {
    let t=document.querySelector(".toast");
    if (!t) { t=document.createElement("div"); t.className="toast"; document.body.appendChild(t); }
    t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),3000);
  }
</script>
</body>
</html>
